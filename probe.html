<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ps5-jailbreak-store probe</title>
</head>
<body>
<pre id="o">loading...</pre>
<script>
const out = [];
const show = (t) => {
  out.push(String(t));
  document.getElementById("o").textContent = out.join("\n");
};
show("UA:   " + navigator.userAgent);
show("URL:  " + location.href);
try {
  const srcs = [].slice.call(document.querySelectorAll("script"))
    .map((s) => s.src || s.getAttribute("src") || "<inline>");
  show("SRCS: " + srcs.join(" | "));
} catch (e) { show("SRCS ERR: " + e); }
(async () => {
  for (const f of ["index.html", "app.js", "style.css", "src/boot.js", "manifest.txt"]) {
    try {
      const r = await fetch(f, { cache: "no-store" });
      const t = await r.text();
      show(f + ": " + r.status + " len=" + t.length + " head=" + JSON.stringify(t.slice(0, 70)));
    } catch (e) {
      show(f + ": ERR " + e);
    }
  }
})();
</script>
</body>
</html>
